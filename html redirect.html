<!DOCTYPE html>
<html lang="hi">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preet Foods - YouTube</title>
  <meta http-equiv="refresh" content="1;url=https://www.youtube.com/@preet_foods">
  <style>
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:Arial,sans-serif; background:#faf7f2; text-align:center;
    }
    .box{
      width:min(90%,420px); background:white; padding:32px 24px; border-radius:20px;

    p{color:#666;line-height:1.5}

      background:#e62117; color:white; text-decoration:none; font-weight:700;
    }
    .small{font-size:13px;margin-top:14px;color:#888}
  </style>
</head>
<body>
  <div class="box">
    <h1>Preet Foods 🍴</h1>
    <p>YouTube चैनल खोला जा रहा है...</p>
    <a href="https://www.youtube.com/@preet_foods">▶ YouTube पर खोलें</a>
    <div class="small">अगर YouTube App अपने-आप न खुले, ऊपर वाले बटन पर टैप करें।</div>
  </div>

</html>
